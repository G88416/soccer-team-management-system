<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soccer Team Management System</title>
  <style>
    :root {
      --bg: #0b1220;
      --bg-soft: #111b2f;
      --panel: #16253f;
      --panel-2: #1a2f50;
      --text: #e8eefc;
      --muted: #9fb0d2;
      --line: rgba(184, 202, 242, 0.2);
      --accent: #56d364;
      --accent-2: #60a5fa;
      --danger: #f87171;
      --warn: #fbbf24;
      --shadow: 0 16px 36px rgba(0, 0, 0, 0.25);
    }

    body.light {
      --bg: #edf3ff;
      --bg-soft: #dfe9ff;
      --panel: #ffffff;
      --panel-2: #f5f8ff;
      --text: #0f1f3b;
      --muted: #4d5f83;
      --line: rgba(88, 113, 168, 0.26);
      --accent: #16a34a;
      --accent-2: #2563eb;
      --danger: #dc2626;
      --warn: #b45309;
      --shadow: 0 14px 30px rgba(57, 84, 138, 0.18);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
      background: linear-gradient(160deg, var(--bg), var(--bg-soft));
      color: var(--text);
      min-height: 100vh;
    }

    .app { min-height: 100vh; padding: 1rem; }
    .hidden { display: none !important; }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .login-wrap {
      max-width: 1100px;
      margin: 1rem auto;
      display: grid;
      gap: 1rem;
    }

    .hero { padding: 1.2rem; }
    .hero h1 { margin: 0 0 .4rem; font-size: clamp(1.3rem, 2.8vw, 2rem); }
    .hero p { margin: 0; color: var(--muted); }

    .portal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1rem;
    }

    .portal-btn {
      width: 100%;
      text-align: left;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1rem;
      cursor: pointer;
      transition: .2s transform, .2s background;
    }

    .portal-btn:hover { transform: translateY(-2px); }
    .portal-btn h3 { margin: 0 0 .35rem; }
    .portal-btn p { margin: 0; color: var(--muted); font-size: .92rem; }

    .shell {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      gap: 1rem;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
      align-items: center;
      justify-content: space-between;
      padding: .9rem 1rem;
    }

    .topbar-left h2 { margin: 0; font-size: 1.1rem; }
    .topbar-left p { margin: .2rem 0 0; color: var(--muted); font-size: .88rem; }

    .actions { display: flex; gap: .5rem; }

    button, input, select, textarea {
      font: inherit;
      border-radius: 10px;
      border: 1px solid var(--line);
      padding: .55rem .7rem;
    }

    button { cursor: pointer; }

    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, var(--accent-2), #7c3aed);
      border: none;
    }

    .btn-ghost {
      background: var(--panel-2);
      color: var(--text);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      padding: .8rem;
    }

    .tab-btn {
      background: var(--panel-2);
      color: var(--muted);
      border: 1px solid var(--line);
      padding: .45rem .7rem;
    }

    .tab-btn.active {
      color: var(--text);
      border-color: transparent;
      background: linear-gradient(135deg, rgba(86,211,100,.3), rgba(96,165,250,.35));
    }

    .panel { padding: 1rem; }

    .grid-4, .grid-3, .grid-2 {
      display: grid;
      gap: .7rem;
    }
    .grid-4 { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    .grid-3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .grid-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }

    .metric {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: .7rem;
    }

    .metric small { color: var(--muted); }
    .metric strong { font-size: 1.2rem; display: block; margin-top: .2rem; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .92rem;
      overflow: hidden;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: .5rem;
      text-align: left;
      vertical-align: top;
    }

    th { color: var(--muted); font-weight: 600; }

    .tag {
      display: inline-block;
      border-radius: 999px;
      padding: .15rem .5rem;
      font-size: .76rem;
      background: rgba(96,165,250,.18);
      color: var(--text);
    }

    .ok { color: var(--accent); }
    .warn { color: var(--warn); }
    .danger { color: var(--danger); }

    .list { display: grid; gap: .55rem; }
    .list-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel-2);
      padding: .65rem;
    }

    .list-item p { margin: .35rem 0 0; color: var(--muted); font-size: .9rem; }

    .composer { display: grid; gap: .55rem; margin-top: .8rem; }
    textarea { min-height: 88px; resize: vertical; }

    .pin-modal {
      position: fixed;
      inset: 0;
      background: rgba(6, 10, 20, .72);
      display: grid;
      place-items: center;
      z-index: 30;
    }

    .pin-body {
      width: min(360px, 92vw);
      padding: 1rem;
      display: grid;
      gap: .7rem;
    }

    .pin-display {
      text-align: center;
      letter-spacing: .35rem;
      font-size: 1.2rem;
      padding: .7rem;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel-2);
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .5rem;
    }

    .keypad button { padding: .7rem; }

    .footer-note { color: var(--muted); font-size: .82rem; text-align: center; }

    @media (max-width: 680px) {
      .app { padding: .6rem; }
      .panel { padding: .75rem; }
      .tabs { padding: .55rem; }
    }
  </style>
</head>
<body>
  <div id="app" class="app">
    <section id="loginScreen" class="login-wrap">
      <article class="hero card">
        <h1>Soccer Team Management System</h1>
        <p>Multi-portal access for coach, player, parent, and board with intelligent readiness insights.</p>
      </article>
      <section id="portalCards" class="portal-grid"></section>
    </section>

    <section id="portalShell" class="shell hidden">
      <header class="topbar card">
        <div class="topbar-left">
          <h2 id="portalTitle">Portal</h2>
          <p id="portalSubtitle"></p>
        </div>
        <div class="actions">
          <button id="themeToggle" class="btn-ghost" type="button">Toggle theme</button>
          <button id="logoutBtn" class="btn-primary" type="button">Logout</button>
        </div>
      </header>

      <nav id="portalTabs" class="tabs card"></nav>
      <main id="portalContent" class="panel card"></main>
    </section>
  </div>

  <section id="pinModal" class="pin-modal hidden" aria-hidden="true">
    <div class="pin-body card">
      <div>
        <strong id="pinTitle">Enter PIN</strong>
        <p id="pinHint" class="footer-note"></p>
      </div>
      <div id="pinDisplay" class="pin-display">••••</div>
      <div class="keypad" id="pinKeys"></div>
      <div class="actions" style="justify-content:space-between;">
        <button id="pinClear" class="btn-ghost" type="button">Clear</button>
        <button id="pinCancel" class="btn-ghost" type="button">Cancel</button>
        <button id="pinSubmit" class="btn-primary" type="button">Unlock</button>
      </div>
      <div id="pinError" class="footer-note"></div>
    </div>
  </section>

  <script>
    const STORAGE_KEY = 'soccer_portal_v2';

    const portalConfig = {
      coach: {
        label: 'Coach Portal',
        subtitle: 'Training control, player management, and AI insights',
        pin: '4321',
        tabs: ['Dashboard', 'Roster', 'Wellness', 'Attendance', 'Messages', 'Matches', 'AI Insights']
      },
      player: {
        label: 'Player Portal',
        subtitle: 'Personal progress, goals, and daily wellness check-in',
        pin: '1111',
        tabs: ['My Dashboard', 'Wellness Check-in', 'Schedule', 'Messages', 'Goals', 'Profile']
      },
      parent: {
        label: 'Parent Portal',
        subtitle: 'Child overview, attendance, schedule, and communication',
        pin: '2222',
        tabs: ['Overview', 'My Child', 'Schedule', 'Messages']
      },
      board: {
        label: 'Board Portal',
        subtitle: 'Executive metrics, squad health, and strategic reporting',
        pin: '9999',
        tabs: ['Executive Dashboard', 'Attendance', 'Squad', 'Matches', 'Board Report']
      }
    };

    const playersSeed = [
      { id: 1, name: 'Ethan Cole', number: 9, position: 'Forward', age: 14, parent: { name: 'Maya Cole', phone: '555-2010', email: 'maya.cole@example.com' }, attendanceHistory: [94, 95, 92, 96], goalsHistory: [1, 0, 2, 1], wellness: { sleep: 8, mood: 4, soreness: 2, stress: 2 }, fitness: 88, academics: 'A-', notes: 'Explosive in transition play.' },
      { id: 2, name: 'Lucas Grant', number: 7, position: 'Winger', age: 13, parent: { name: 'Jordan Grant', phone: '555-2011', email: 'jordan.grant@example.com' }, attendanceHistory: [90, 88, 91, 90], goalsHistory: [0, 1, 1, 0], wellness: { sleep: 7, mood: 4, soreness: 3, stress: 3 }, fitness: 82, academics: 'B+', notes: 'Strong one-on-one creator.' },
      { id: 3, name: 'Noah Price', number: 6, position: 'Midfielder', age: 14, parent: { name: 'Tina Price', phone: '555-2012', email: 'tina.price@example.com' }, attendanceHistory: [97, 95, 96, 98], goalsHistory: [0, 1, 0, 1], wellness: { sleep: 9, mood: 5, soreness: 1, stress: 2 }, fitness: 91, academics: 'A', notes: 'Leads tempo and passing lanes.' },
      { id: 4, name: 'Mason Reed', number: 4, position: 'Defender', age: 15, parent: { name: 'Claire Reed', phone: '555-2013', email: 'claire.reed@example.com' }, attendanceHistory: [84, 82, 86, 85], goalsHistory: [0, 0, 0, 0], wellness: { sleep: 6, mood: 3, soreness: 4, stress: 3 }, fitness: 78, academics: 'B', notes: 'Aerial duels are improving.' },
      { id: 5, name: 'Aiden Shaw', number: 1, position: 'Goalkeeper', age: 14, parent: { name: 'Monica Shaw', phone: '555-2014', email: 'monica.shaw@example.com' }, attendanceHistory: [93, 91, 92, 94], goalsHistory: [0, 0, 0, 0], wellness: { sleep: 8, mood: 4, soreness: 2, stress: 1 }, fitness: 87, academics: 'A-', notes: 'Fast reaction saves in close range.' },
      { id: 6, name: 'Liam Foster', number: 3, position: 'Defender', age: 13, parent: { name: 'Andre Foster', phone: '555-2015', email: 'andre.foster@example.com' }, attendanceHistory: [88, 86, 85, 89], goalsHistory: [0, 0, 1, 0], wellness: { sleep: 7, mood: 3, soreness: 3, stress: 4 }, fitness: 79, academics: 'B+', notes: 'Needs confidence in build-out play.' },
      { id: 7, name: 'Caleb Miles', number: 8, position: 'Midfielder', age: 14, parent: { name: 'Reese Miles', phone: '555-2016', email: 'reese.miles@example.com' }, attendanceHistory: [92, 90, 91, 93], goalsHistory: [1, 1, 0, 1], wellness: { sleep: 8, mood: 4, soreness: 2, stress: 2 }, fitness: 85, academics: 'A', notes: 'High work rate and tactical awareness.' },
      { id: 8, name: 'Owen Diaz', number: 11, position: 'Forward', age: 15, parent: { name: 'Sara Diaz', phone: '555-2017', email: 'sara.diaz@example.com' }, attendanceHistory: [80, 84, 82, 81], goalsHistory: [1, 0, 1, 0], wellness: { sleep: 6, mood: 3, soreness: 4, stress: 4 }, fitness: 74, academics: 'B-', notes: 'Finishing quality is good, stamina fluctuates.' }
    ];

    const matches = [
      { date: '2026-05-10', opponent: 'River Hawks', type: 'League', location: 'Home', status: 'Scheduled' },
      { date: '2026-05-14', opponent: 'City Rovers', type: 'League', location: 'Away', status: 'Scheduled' },
      { date: '2026-05-19', opponent: 'Falcon Youth', type: 'Friendly', location: 'Home', status: 'Planned' },
      { date: '2026-05-24', opponent: 'Academy Blue', type: 'Cup', location: 'Away', status: 'Scheduled' }
    ];

    const messagesSeed = [
      { id: 1, from: 'Coach', to: 'Parents', subject: 'Recovery Day Reminder', body: 'Tomorrow is low-load recovery and film review.', date: '2026-05-05' },
      { id: 2, from: 'Board', to: 'All', subject: 'Community Event', body: 'Fundraiser kickoff starts next Saturday.', date: '2026-05-04' },
      { id: 3, from: 'Coach', to: 'Players', subject: 'Hydration Focus', body: 'Track hydration and sleep before match week.', date: '2026-05-03' }
    ];

    const state = {
      theme: 'dark',
      activePortal: null,
      activeTab: null,
      pendingPortal: null,
      enteredPin: '',
      selectedPlayerId: 1,
      selectedChildId: 1,
      players: playersSeed,
      matches,
      messages: messagesSeed,
      checkins: {},
      customNotes: []
    };

    const readinessWeights = {
      sleep: 8,
      mood: 12,
      soreness: 7,
      stress: 6,
      attendance: 0.45,
      wellness: 0.25,
      form: 0.30,
      min: 45,
      max: 99
    };

    const els = {};

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        theme: state.theme,
        activePortal: state.activePortal,
        activeTab: state.activeTab,
        selectedPlayerId: state.selectedPlayerId,
        selectedChildId: state.selectedChildId,
        players: state.players,
        messages: state.messages,
        checkins: state.checkins,
        customNotes: state.customNotes
      }));
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        state.theme = parsed.theme || state.theme;
        state.activePortal = parsed.activePortal || null;
        state.activeTab = parsed.activeTab || null;
        state.selectedPlayerId = parsed.selectedPlayerId || 1;
        state.selectedChildId = parsed.selectedChildId || 1;
        if (Array.isArray(parsed.players) && parsed.players.length === 8) state.players = parsed.players;
        if (Array.isArray(parsed.messages)) state.messages = parsed.messages;
        if (parsed.checkins && typeof parsed.checkins === 'object') state.checkins = parsed.checkins;
        if (Array.isArray(parsed.customNotes)) state.customNotes = parsed.customNotes;
      } catch (_) {}
    }

    function applyTheme() {
      document.body.classList.toggle('light', state.theme === 'light');
    }

    function avg(arr) {
      return arr.reduce((sum, v) => sum + v, 0) / (arr.length || 1);
    }

    function attendanceOf(player) {
      return Math.round(avg(player.attendanceHistory));
    }

    function goalsOf(player) {
      return player.goalsHistory.reduce((s, v) => s + v, 0);
    }

    function readinessOf(player) {
      const attendance = attendanceOf(player);
      const wellnessScore = (
        (player.wellness.sleep * readinessWeights.sleep) +
        (player.wellness.mood * readinessWeights.mood) -
        (player.wellness.soreness * readinessWeights.soreness) -
        (player.wellness.stress * readinessWeights.stress)
      );
      const form = goalsOf(player) * 4 + player.fitness;
      const score = Math.max(
        readinessWeights.min,
        Math.min(
          readinessWeights.max,
          Math.round(
            (attendance * readinessWeights.attendance) +
            (wellnessScore * readinessWeights.wellness) +
            (form * readinessWeights.form)
          )
        )
      );
      return score;
    }

    function teamReadiness() {
      return Math.round(avg(state.players.map(readinessOf)));
    }

    function attendanceAverage() {
      return Math.round(avg(state.players.map(attendanceOf)));
    }

    function attendancePrediction() {
      const baseline = attendanceAverage();
      const stressFactor = Math.round(avg(state.players.map((p) => p.wellness.stress)) * 1.8);
      const sorenessFactor = Math.round(avg(state.players.map((p) => p.wellness.soreness)) * 1.5);
      return Math.max(70, Math.min(98, baseline - Math.floor((stressFactor + sorenessFactor) / 3) + 2));
    }

    function smartAlerts() {
      const alerts = [];
      state.players.forEach((player) => {
        const rd = readinessOf(player);
        const at = attendanceOf(player);
        if (rd < 75) alerts.push(`${player.name}: readiness is ${rd}% — monitor workload.`);
        if (at < 85) alerts.push(`${player.name}: attendance trend ${at}% — parent follow-up recommended.`);
        if (player.wellness.stress >= 4) alerts.push(`${player.name}: stress high (${player.wellness.stress}/5) — recovery protocol advised.`);
      });
      return alerts.slice(0, 8);
    }

    function recommendations() {
      const topRisk = [...state.players].sort((a, b) => readinessOf(a) - readinessOf(b)).slice(0, 3);
      const topPerformers = [...state.players].sort((a, b) => readinessOf(b) - readinessOf(a)).slice(0, 2);
      return [
        `Team readiness is ${teamReadiness()}%. Prioritize low-load recovery before next fixture.`,
        `Predicted next attendance is ${attendancePrediction()}%. Send reminders 24h before training.`,
        `High-support players: ${topRisk.map((p) => p.name).join(', ')}.`,
        `Leadership group in form: ${topPerformers.map((p) => p.name).join(', ')}.`
      ];
    }

    function esc(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function statusClass(value) {
      if (value >= 88) return 'ok';
      if (value >= 78) return 'warn';
      return 'danger';
    }

    function selectedPlayer() {
      return state.players.find((p) => p.id === Number(state.selectedPlayerId)) || state.players[0];
    }

    function selectedChild() {
      return state.players.find((p) => p.id === Number(state.selectedChildId)) || state.players[0];
    }

    function orderedMessages() {
      return [...state.messages].sort((a, b) => {
        const byDate = String(b.date).localeCompare(String(a.date));
        if (byDate !== 0) return byDate;
        return String(b.id).localeCompare(String(a.id));
      });
    }

    function renderPortalCards() {
      const html = Object.entries(portalConfig).map(([key, portal]) => `
        <button class="portal-btn" data-portal="${key}" type="button">
          <h3>${esc(portal.label)}</h3>
          <p>${esc(portal.subtitle)}</p>
        </button>
      `).join('');
      els.portalCards.innerHTML = html;
      els.portalCards.querySelectorAll('[data-portal]').forEach((btn) => {
        btn.addEventListener('click', () => openPinModal(btn.dataset.portal));
      });
    }

    function openPinModal(portal) {
      state.pendingPortal = portal;
      state.enteredPin = '';
      els.pinTitle.textContent = `Enter ${portalConfig[portal].label} PIN`;
      els.pinHint.textContent = 'Use the keypad to unlock your portal.';
      els.pinError.textContent = '';
      renderPinDisplay();
      els.pinModal.classList.remove('hidden');
      els.pinModal.setAttribute('aria-hidden', 'false');
    }

    function closePinModal() {
      els.pinModal.classList.add('hidden');
      els.pinModal.setAttribute('aria-hidden', 'true');
      state.pendingPortal = null;
      state.enteredPin = '';
      els.pinError.textContent = '';
    }

    function renderPinDisplay() {
      const dots = '•'.repeat(state.enteredPin.length);
      const rest = '•'.repeat(Math.max(0, 4 - state.enteredPin.length));
      els.pinDisplay.textContent = `${dots}${rest}` || '••••';
    }

    function verifyPin() {
      if (!state.pendingPortal) return;
      const expected = portalConfig[state.pendingPortal].pin;
      if (state.enteredPin === expected) {
        state.activePortal = state.pendingPortal;
        state.activeTab = portalConfig[state.activePortal].tabs[0];
        closePinModal();
        saveState();
        render();
        return;
      }
      els.pinError.textContent = 'Invalid PIN. Please try again.';
      state.enteredPin = '';
      renderPinDisplay();
    }

    function portalTopSummary() {
      const portal = portalConfig[state.activePortal];
      els.portalTitle.textContent = portal.label;
      els.portalSubtitle.textContent = portal.subtitle;
    }

    function renderTabs() {
      const tabs = portalConfig[state.activePortal].tabs;
      els.portalTabs.innerHTML = tabs.map((tab) => `
        <button class="tab-btn ${state.activeTab === tab ? 'active' : ''}" data-tab="${esc(tab)}" type="button">${esc(tab)}</button>
      `).join('');
      els.portalTabs.querySelectorAll('[data-tab]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.activeTab = btn.dataset.tab;
          saveState();
          renderPortalContent();
          renderTabs();
        });
      });
    }

    function renderCoachContent() {
      const tab = state.activeTab;
      if (tab === 'Dashboard') {
        return `
          <section class="grid-4">
            <article class="metric"><small>Team readiness</small><strong class="${statusClass(teamReadiness())}">${teamReadiness()}%</strong></article>
            <article class="metric"><small>Average attendance</small><strong>${attendanceAverage()}%</strong></article>
            <article class="metric"><small>Predicted attendance</small><strong>${attendancePrediction()}%</strong></article>
            <article class="metric"><small>Open alerts</small><strong>${smartAlerts().length}</strong></article>
          </section>
          <section class="list" style="margin-top:.8rem;">
            ${smartAlerts().map((a) => `<article class="list-item"><strong>Alert</strong><p>${esc(a)}</p></article>`).join('') || '<p>No alerts.</p>'}
          </section>
        `;
      }

      if (tab === 'Roster') {
        return `
          <table>
            <thead><tr><th>#</th><th>Player</th><th>Position</th><th>Readiness</th><th>Goals</th><th>Parent Contact</th></tr></thead>
            <tbody>
              ${state.players.map((p) => `<tr>
                <td>${p.number}</td>
                <td>${esc(p.name)}</td>
                <td>${esc(p.position)}</td>
                <td class="${statusClass(readinessOf(p))}">${readinessOf(p)}%</td>
                <td>${goalsOf(p)}</td>
                <td>${esc(p.parent.name)}<br><small>${esc(p.parent.phone)}</small></td>
              </tr>`).join('')}
            </tbody>
          </table>
        `;
      }

      if (tab === 'Wellness') {
        return `
          <div class="grid-3">
            ${state.players.map((p) => `<article class="list-item">
              <strong>${esc(p.name)}</strong>
              <p>Sleep: ${p.wellness.sleep}h • Mood: ${p.wellness.mood}/5 • Soreness: ${p.wellness.soreness}/5 • Stress: ${p.wellness.stress}/5</p>
            </article>`).join('')}
          </div>
        `;
      }

      if (tab === 'Attendance') {
        return `
          <table>
            <thead><tr><th>Player</th><th>Last 4 Sessions</th><th>Average</th><th>Prediction Impact</th></tr></thead>
            <tbody>
              ${state.players.map((p) => `<tr>
                <td>${esc(p.name)}</td>
                <td>${p.attendanceHistory.map((value) => `${value}%`).join(', ')}</td>
                <td>${attendanceOf(p)}%</td>
                <td>${attendanceOf(p) < 85 ? '<span class="warn">Needs intervention</span>' : '<span class="ok">Stable</span>'}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        `;
      }

      if (tab === 'Messages') {
        return `
          <div class="list">
            ${orderedMessages().map((m) => `<article class="list-item"><strong>${esc(m.subject)}</strong><p>${esc(m.date)} • ${esc(m.from)} → ${esc(m.to)}<br>${esc(m.body)}</p></article>`).join('')}
          </div>
          <div class="composer">
            <label for="newSubject">Subject</label>
            <input id="newSubject" type="text" maxlength="80" placeholder="Subject" aria-label="Message subject" />
            <label for="newBody">Message</label>
            <textarea id="newBody" maxlength="300" placeholder="Write message for players/parents..." aria-label="Message body"></textarea>
            <button id="sendMessage" class="btn-primary" type="button">Send Message</button>
          </div>
        `;
      }

      if (tab === 'Matches') {
        return `
          <table>
            <thead><tr><th>Date</th><th>Opponent</th><th>Type</th><th>Location</th><th>Status</th></tr></thead>
            <tbody>
              ${state.matches.map((m) => `<tr><td>${esc(m.date)}</td><td>${esc(m.opponent)}</td><td>${esc(m.type)}</td><td>${esc(m.location)}</td><td><span class="tag">${esc(m.status)}</span></td></tr>`).join('')}
            </tbody>
          </table>
        `;
      }

      return `
        <div class="list">
          ${recommendations().map((r) => `<article class="list-item"><strong>AI Recommendation</strong><p>${esc(r)}</p></article>`).join('')}
        </div>
      `;
    }

    function renderPlayerContent() {
      const playerOptions = state.players.map((p) => `<option value="${p.id}" ${p.id === Number(state.selectedPlayerId) ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
      const p = selectedPlayer();
      const readiness = readinessOf(p);
      const checkin = state.checkins[p.id] || { sleep: p.wellness.sleep, mood: p.wellness.mood, stress: p.wellness.stress, soreness: p.wellness.soreness };
      const tab = state.activeTab;

      const selector = `<div style="margin-bottom:.8rem;"><label>Player profile: <select id="playerSelect">${playerOptions}</select></label></div>`;

      if (tab === 'My Dashboard') {
        return `${selector}
          <div class="grid-4">
            <article class="metric"><small>Readiness</small><strong class="${statusClass(readiness)}">${readiness}%</strong></article>
            <article class="metric"><small>Attendance</small><strong>${attendanceOf(p)}%</strong></article>
            <article class="metric"><small>Total goals</small><strong>${goalsOf(p)}</strong></article>
            <article class="metric"><small>Fitness score</small><strong>${p.fitness}</strong></article>
          </div>
          <article class="list-item" style="margin-top:.8rem;"><strong>Coach note</strong><p>${esc(p.notes)}</p></article>
        `;
      }

      if (tab === 'Wellness Check-in') {
        return `${selector}
          <div class="composer">
            <label for="wSleep">Sleep (hours)</label>
            <input id="wSleep" type="number" min="4" max="12" value="${checkin.sleep}" />
            <label for="wMood">Mood (1-5)</label>
            <input id="wMood" type="number" min="1" max="5" value="${checkin.mood}" />
            <label for="wSoreness">Soreness (1-5)</label>
            <input id="wSoreness" type="number" min="1" max="5" value="${checkin.soreness}" />
            <label for="wStress">Stress (1-5)</label>
            <input id="wStress" type="number" min="1" max="5" value="${checkin.stress}" />
            <button id="saveCheckin" class="btn-primary" type="button">Save check-in</button>
          </div>
        `;
      }

      if (tab === 'Schedule') {
        return `${selector}${renderScheduleTable()}`;
      }

      if (tab === 'Messages') {
      return `${selector}
        <div class="list">
          ${orderedMessages().filter((m) => m.to === 'Players' || m.to === 'All').map((m) => `<article class="list-item"><strong>${esc(m.subject)}</strong><p>${esc(m.date)} • ${esc(m.from)}<br>${esc(m.body)}</p></article>`).join('')}
        </div>
      `;
    }

      if (tab === 'Goals') {
        return `${selector}
          <article class="list-item"><strong>Goal Progress</strong><p>Last 4 matches: ${p.goalsHistory.join(', ')} goals per match.</p></article>
          <article class="list-item"><strong>Target</strong><p>Maintain 2+ high-intensity runs in final third each game week.</p></article>
        `;
      }

      return `${selector}
        <article class="list-item"><strong>Profile</strong><p>${esc(p.name)} (#${p.number}) • ${esc(p.position)} • Age ${p.age}</p></article>
        <article class="list-item"><strong>Academics</strong><p>${esc(p.academics)}</p></article>
        <article class="list-item"><strong>Parent Contact</strong><p>${esc(p.parent.name)} • ${esc(p.parent.phone)} • ${esc(p.parent.email)}</p></article>
      `;
    }

    function renderParentContent() {
      const options = state.players.map((p) => `<option value="${p.id}" ${p.id === Number(state.selectedChildId) ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
      const child = selectedChild();
      const tab = state.activeTab;
      const selector = `<div style="margin-bottom:.8rem;"><label>Child: <select id="childSelect">${options}</select></label></div>`;

      if (tab === 'Overview') {
        return `${selector}
          <div class="grid-4">
            <article class="metric"><small>Child readiness</small><strong class="${statusClass(readinessOf(child))}">${readinessOf(child)}%</strong></article>
            <article class="metric"><small>Child attendance</small><strong>${attendanceOf(child)}%</strong></article>
            <article class="metric"><small>Team readiness</small><strong>${teamReadiness()}%</strong></article>
            <article class="metric"><small>Next attendance prediction</small><strong>${attendancePrediction()}%</strong></article>
          </div>
        `;
      }

      if (tab === 'My Child') {
        return `${selector}
          <article class="list-item"><strong>Performance</strong><p>Goals in recent matches: ${child.goalsHistory.join(', ')}</p></article>
          <article class="list-item"><strong>Wellness Snapshot</strong><p>Sleep ${child.wellness.sleep}h • Mood ${child.wellness.mood}/5 • Stress ${child.wellness.stress}/5</p></article>
          <article class="list-item"><strong>Coach Notes</strong><p>${esc(child.notes)}</p></article>
        `;
      }

      if (tab === 'Schedule') {
        return `${selector}${renderScheduleTable()}`;
      }

      return `${selector}
        <div class="list">
          ${orderedMessages().filter((m) => m.to === 'Parents' || m.to === 'All').map((m) => `<article class="list-item"><strong>${esc(m.subject)}</strong><p>${esc(m.date)} • ${esc(m.from)}<br>${esc(m.body)}</p></article>`).join('')}
        </div>
      `;
    }

    function renderBoardContent() {
      const tab = state.activeTab;
      if (tab === 'Executive Dashboard') {
        return `
          <div class="grid-4">
            <article class="metric"><small>Team readiness</small><strong>${teamReadiness()}%</strong></article>
            <article class="metric"><small>Average attendance</small><strong>${attendanceAverage()}%</strong></article>
            <article class="metric"><small>Projected attendance</small><strong>${attendancePrediction()}%</strong></article>
            <article class="metric"><small>Total goals (last 4)</small><strong>${state.players.reduce((s, p) => s + goalsOf(p), 0)}</strong></article>
          </div>
        `;
      }

      if (tab === 'Attendance') {
        return `
          <table>
            <thead><tr><th>Player</th><th>Avg Attendance</th><th>Risk Level</th></tr></thead>
            <tbody>${state.players.map((p) => `<tr><td>${esc(p.name)}</td><td>${attendanceOf(p)}%</td><td>${attendanceOf(p) < 85 ? '<span class="warn">Medium</span>' : '<span class="ok">Low</span>'}</td></tr>`).join('')}</tbody>
          </table>
        `;
      }

      if (tab === 'Squad') {
        return `
          <table>
            <thead><tr><th>Name</th><th>Position</th><th>Fitness</th><th>Readiness</th><th>Academic</th></tr></thead>
            <tbody>${state.players.map((p) => `<tr><td>${esc(p.name)}</td><td>${esc(p.position)}</td><td>${p.fitness}</td><td>${readinessOf(p)}%</td><td>${esc(p.academics)}</td></tr>`).join('')}</tbody>
          </table>
        `;
      }

      if (tab === 'Matches') {
        return renderScheduleTable();
      }

      return `
        <div class="list">
          ${recommendations().map((r) => `<article class="list-item"><strong>Board Insight</strong><p>${esc(r)}</p></article>`).join('')}
          <article class="list-item"><strong>Strategy Note</strong><p>Invest in recovery programming and parent communication automation to improve attendance consistency.</p></article>
        </div>
      `;
    }

    function renderScheduleTable() {
      return `
        <table>
          <thead><tr><th>Date</th><th>Opponent</th><th>Type</th><th>Location</th><th>Status</th></tr></thead>
          <tbody>
            ${state.matches.map((m) => `<tr><td>${esc(m.date)}</td><td>${esc(m.opponent)}</td><td>${esc(m.type)}</td><td>${esc(m.location)}</td><td>${esc(m.status)}</td></tr>`).join('')}
          </tbody>
        </table>
      `;
    }

    function renderPortalContent() {
      let html = '';
      if (state.activePortal === 'coach') html = renderCoachContent();
      if (state.activePortal === 'player') html = renderPlayerContent();
      if (state.activePortal === 'parent') html = renderParentContent();
      if (state.activePortal === 'board') html = renderBoardContent();
      els.portalContent.innerHTML = html;
      bindPortalContentEvents();
    }

    function bindPortalContentEvents() {
      const playerSelect = document.getElementById('playerSelect');
      if (playerSelect) {
        playerSelect.addEventListener('change', () => {
          state.selectedPlayerId = Number(playerSelect.value);
          saveState();
          renderPortalContent();
        });
      }

      const childSelect = document.getElementById('childSelect');
      if (childSelect) {
        childSelect.addEventListener('change', () => {
          state.selectedChildId = Number(childSelect.value);
          saveState();
          renderPortalContent();
        });
      }

      const sendMessage = document.getElementById('sendMessage');
      if (sendMessage) {
        sendMessage.addEventListener('click', () => {
          const subject = document.getElementById('newSubject').value.trim();
          const body = document.getElementById('newBody').value.trim();
          if (!subject || !body) return;
          state.messages.unshift({
            id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
            from: 'Coach',
            to: 'Parents',
            subject: subject.slice(0, 80),
            body: body.slice(0, 300),
            date: new Date().toISOString().slice(0, 10)
          });
          state.messages = state.messages.slice(0, 24);
          saveState();
          renderPortalContent();
        });
      }

      const saveCheckin = document.getElementById('saveCheckin');
      if (saveCheckin) {
        saveCheckin.addEventListener('click', () => {
          const p = selectedPlayer();
          const sleep = Math.max(4, Math.min(12, Number(document.getElementById('wSleep').value) || p.wellness.sleep));
          const mood = Math.max(1, Math.min(5, Number(document.getElementById('wMood').value) || p.wellness.mood));
          const soreness = Math.max(1, Math.min(5, Number(document.getElementById('wSoreness').value) || p.wellness.soreness));
          const stress = Math.max(1, Math.min(5, Number(document.getElementById('wStress').value) || p.wellness.stress));
          state.checkins[p.id] = { sleep, mood, soreness, stress, updatedAt: new Date().toISOString() };
          p.wellness = { sleep, mood, soreness, stress };
          saveState();
          renderPortalContent();
        });
      }
    }

    function render() {
      applyTheme();
      const loggedIn = Boolean(state.activePortal);
      els.loginScreen.classList.toggle('hidden', loggedIn);
      els.portalShell.classList.toggle('hidden', !loggedIn);

      if (!loggedIn) {
        renderPortalCards();
        return;
      }

      if (!state.activeTab || !portalConfig[state.activePortal].tabs.includes(state.activeTab)) {
        state.activeTab = portalConfig[state.activePortal].tabs[0];
      }

      portalTopSummary();
      renderTabs();
      renderPortalContent();
      saveState();
    }

    function buildKeypad() {
      const keys = ['1','2','3','4','5','6','7','8','9','0'];
      els.pinKeys.innerHTML = keys.map((k) => `<button data-digit="${k}" type="button">${k}</button>`).join('');
      els.pinKeys.querySelectorAll('[data-digit]').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (state.enteredPin.length >= 4) return;
          state.enteredPin += btn.dataset.digit;
          renderPinDisplay();
        });
      });
    }

    function bindStaticEvents() {
      els.themeToggle.addEventListener('click', () => {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        saveState();
        render();
      });

      els.logoutBtn.addEventListener('click', () => {
        state.activePortal = null;
        state.activeTab = null;
        saveState();
        render();
      });

      els.pinClear.addEventListener('click', () => {
        state.enteredPin = '';
        els.pinError.textContent = '';
        renderPinDisplay();
      });

      els.pinCancel.addEventListener('click', closePinModal);
      els.pinSubmit.addEventListener('click', verifyPin);

      document.addEventListener('keydown', (e) => {
        if (els.pinModal.classList.contains('hidden')) return;
        if (/\d/.test(e.key) && state.enteredPin.length < 4) {
          state.enteredPin += e.key;
          renderPinDisplay();
        } else if (e.key === 'Backspace') {
          state.enteredPin = state.enteredPin.slice(0, -1);
          renderPinDisplay();
        } else if (e.key === 'Enter') {
          verifyPin();
        } else if (e.key === 'Escape') {
          closePinModal();
        }
      });
    }

    function bindElements() {
      Object.assign(els, {
        loginScreen: document.getElementById('loginScreen'),
        portalCards: document.getElementById('portalCards'),
        portalShell: document.getElementById('portalShell'),
        portalTitle: document.getElementById('portalTitle'),
        portalSubtitle: document.getElementById('portalSubtitle'),
        portalTabs: document.getElementById('portalTabs'),
        portalContent: document.getElementById('portalContent'),
        themeToggle: document.getElementById('themeToggle'),
        logoutBtn: document.getElementById('logoutBtn'),
        pinModal: document.getElementById('pinModal'),
        pinTitle: document.getElementById('pinTitle'),
        pinHint: document.getElementById('pinHint'),
        pinDisplay: document.getElementById('pinDisplay'),
        pinKeys: document.getElementById('pinKeys'),
        pinClear: document.getElementById('pinClear'),
        pinCancel: document.getElementById('pinCancel'),
        pinSubmit: document.getElementById('pinSubmit'),
        pinError: document.getElementById('pinError')
      });
    }

    function init() {
      bindElements();
      loadState();
      buildKeypad();
      bindStaticEvents();
      render();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
